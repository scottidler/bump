[package]
name = "bump"
version = "0.3.1"
edition = "2024"
authors = ["Scott Idler <scott.idler@gmail.com>"]
build = "build.rs"
description = "Bump semantic versions, commit, and tag (Rust, Python, or any git repo)"

[dependencies]
clap = { version = "4.5.53", features = ["derive", "wrap_help"] }
dirs = "6.0.0"
env_logger = "0.11.8"
eyre = "0.6.12"
log = "0.4.29"
semver = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
tempfile = "3.16"
toml_edit = "0.22"

[dev-dependencies]

[build-dependencies]
